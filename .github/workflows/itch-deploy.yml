name: Deploy to itch.io

on:
  release:
    types: [published]
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: Preaching-linux-x64
          path: linux

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Preaching-windows-x64.exe
          path: windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: Preaching-macos-x64
          path: macos

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push linux ${{ secrets.ITCH_USERNAME }}/belen-preaching:linux
          ./butler push windows ${{ secrets.ITCH_USERNAME }}/belen-preaching:windows
          ./butler push macos ${{ secrets.ITCH_USERNAME }}/belen-preaching:macos
