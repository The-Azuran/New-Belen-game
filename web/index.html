<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preaching the Truth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>PREACHING THE TRUTH</h1>
            <p class="dedication">Dedicated to my sister, Monica Huertas</p>
            <p class="credits">By Rowan Valis & Claude</p>
        </div>

        <div id="status-bar">
            <span id="stat-preacher">Preacher: -</span>
            <span id="stat-day">Day: -</span>
            <span id="stat-hunger">Hunger: 0/100</span>
            <span id="stat-money">Money: $0</span>
            <span id="stat-souls">Souls: 0</span>
        </div>

        <div id="location-bar">
            <span id="current-location">-</span>
        </div>

        <div id="output"></div>

        <div id="choices"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
